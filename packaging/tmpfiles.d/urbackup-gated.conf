# Runtime directory for urbackup-gated, recreated on every boot.
#
# A systemd --user service cannot create a directory in /run itself, so this
# snippet does it. The service user owns it: the unprivileged daemon needs to
# write there, while only that user and root - the NetworkManager dispatcher -
# may create files in it. World readable so the status is easy to look at.
d /run/urbackup-gated 0755 @USER@ @GROUP@ -
