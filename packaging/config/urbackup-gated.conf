# Configuration for urbackup-gated. The format is TOML.
#
# Only allowed_ssids is required. Everything else falls back to the defaults
# shown below, so you may delete any of it.
#
# If this file is missing, unreadable or invalid, the UrBackup client is kept
# stopped and an error dialog explains why. A missed backup is harmless; an
# unchecked backup over a metered connection is what this service prevents.

# Wifi networks over which backups may run. Compared case sensitively, so
# "lieluX" and "lielux" are two different networks. Any active wifi connection
# that is not listed here forbids backups - even when ethernet is up as well.
allowed_ssids = ["lieluX", "lielux", "lieluxVPN", "HZDR"]

[intervals]
# How often the network and client state are checked.
check_seconds = 30
# Shorter cadence while the live status window is open.
check_seconds_window_open = 5
# Reminder while no backup is running.
idle_notify_seconds = 7200
# Progress report while a backup is running.
progress_notify_seconds = 900

[notify]
# How long a notification stays on screen.
timeout_seconds = 5
