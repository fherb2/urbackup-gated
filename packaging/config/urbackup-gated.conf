# urbackup-gated - configuration. The format is TOML.
#
# What this service does: it decides whether the UrBackup client is allowed to
# run, based on the networks you are currently connected to, and starts or stops
# it accordingly. A wifi that is not listed below forbids backups - that is what
# keeps a full backup off your phone's data plan. It also reports what is going
# on through desktop notifications.
#
# Full documentation:  /usr/local/share/doc/urbackup-gated/README.md
# Current status:      urbackup-gated-ctl status
#
# To remove the service again:
#
#     sudo urbackup-gated-uninstall
#
# That puts urbackupclientbackend.service back into the system start, because
# once nothing gates it any more, leaving it disabled would silently mean no
# backups at all. This file is kept; delete it by hand if you want it gone.
#
# Changes here take effect only after:  systemctl --user restart urbackup-gated
#
# Only allowed_ssids is required. Everything else falls back to the defaults
# shown below, so you may delete any of it.
#
# If this file is missing, unreadable or invalid, the UrBackup client is kept
# stopped and an error dialog explains why. A missed backup is harmless; an
# unchecked backup over a metered connection is what this service prevents.

# Wifi networks over which backups may run. Compared case sensitively, so
# "lieluX" and "lielux" are two different networks. Any active wifi connection
# that is not listed here forbids backups - even when ethernet is up as well.
allowed_ssids = ["lieluX", "lielux", "lieluxVPN", "HZDR"]

[intervals]
# How often the network and client state are checked.
check_seconds = 30
# Shorter cadence while the live status window is open.
check_seconds_window_open = 5
# Reminder while no backup is running.
idle_notify_seconds = 7200
# Progress report while a backup is running.
progress_notify_seconds = 900

[notify]
# How long a notification stays on screen.
timeout_seconds = 5
